<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">What six website buyers asked Kiwi Web Design</title>
  <desc id="desc">Horizontal bars show the number of six eligible enquiries mentioning price and scope, search visibility, recurring costs, ownership, booking or payment, and timing.</desc>
  <rect width="1200" height="675" fill="#f3f6f4"/>
  <rect x="64" y="52" width="1072" height="571" rx="8" fill="#ffffff" stroke="#d9dfdc"/>
  <text x="104" y="112" fill="#171717" font-family="Arial, sans-serif" font-size="38" font-weight="700">What website buyers asked</text>
  <text x="104" y="148" fill="#595959" font-family="Arial, sans-serif" font-size="20">Six eligible first-contact enquiries received 11 June to 26 August 2026</text>
  <g font-family="Arial, sans-serif" font-size="19" fill="#242424">
    <text x="104" y="220">Quote or scope</text><rect x="400" y="198" width="420" height="28" fill="#155e75"/><text x="840" y="220" font-weight="700">3/6</text>
    <text x="104" y="286">Search visibility</text><rect x="400" y="264" width="280" height="28" fill="#2f7d67"/><text x="700" y="286" font-weight="700">2/6</text>
    <text x="104" y="352">Recurring costs</text><rect x="400" y="330" width="280" height="28" fill="#2f7d67"/><text x="700" y="352" font-weight="700">2/6</text>
    <text x="104" y="418">Ownership or access</text><rect x="400" y="396" width="280" height="28" fill="#2f7d67"/><text x="700" y="418" font-weight="700">2/6</text>
    <text x="104" y="484">Booking or payment</text><rect x="400" y="462" width="280" height="28" fill="#2f7d67"/><text x="700" y="484" font-weight="700">2/6</text>
    <text x="104" y="550">Launch timing</text><rect x="400" y="528" width="280" height="28" fill="#2f7d67"/><text x="700" y="550" font-weight="700">2/6</text>
  </g>
  <text x="104" y="592" fill="#666666" font-family="Arial, sans-serif" font-size="16">Multiple themes could be coded in one enquiry. Small observed sample, not a survey of all Auckland buyers.</text>
</svg>
